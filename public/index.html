<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <style>
  @font-face {
    font-family: "MyFont";
    src: url("fonts/georgia.ttf") format("truetype");
    font-display: swap;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px 20px;
    color: #222;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
  }

  h1 {
    margin: 0 0 10px;
    color: #1f2937;
    text-align: center;
    font-size: 36px;
  }

  #products-count {
    margin: 0 auto 30px;
    color: #64748b;
    text-align: center;
    font-size: 18px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    overflow: hidden;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
  }

  .card img {
    display: block;
    width: 100%;
    height: 220px;
    padding: 15px;
    object-fit: contain;
    background: #f8fafc;
  }

  .card h2 {
    margin: 18px 18px 8px;
    color: #1e293b;
    font-size: 22px;
  }

  .card p {
    margin: 8px 18px;
    color: #64748b;
    font-size: 16px;
  }

  .card button {
    width: calc(100% - 36px);
    margin: 15px 18px 20px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #44ba56;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }

  .search {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 20px;
    padding: 10px;
    font-size: 16px;
  }

  .stats {
    position: fixed;
    right: 10px;
    bottom: 10px;
    padding: 10px 14px;
    background: #1f4e79;
    color: #ffffff;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    z-index: 1000;
  }

  .up {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 10px 14px;
    display: none;
    z-index: 1001;
  }

  @media (max-width: 600px) {
    body {
      padding: 25px 15px;
    }

    h1 {
      font-size: 28px;
    }

    .cards {
      grid-template-columns: 1fr;
    }

    .card img {
      height: 200px;
    }

    .search {
      max-width: 100%;
    }

    .stats {
      right: 8px;
      bottom: 8px;
      font-size: 12px;
    }

    .more {
      display: block;
      margin: 30px auto;
      padding: 12px 24px;
      font-size: 16px;
    }


    .up {
      right: 8px;
      bottom: 8px;
    }
  }
</style>


  <link rel="preload" href="fonts/georgia.ttf" as="font"
        type="font/ttf" crossorigin>

   <link rel="stylesheet" href="style.css"
        media="print" onload="this.media='all'">

  <noscript>
    <link rel="stylesheet" href="style.css">
  </noscript>
    

</head>
<body>

  <header>
    <h1>Каталог товаров</h1>
    <p id="total"></p>
    <p id="clock"></p>
  </header>

  <input class="search" id="search" placeholder="Поиск по названию">
 
  <div class="stats">
    <div id="filterRuns">Поиск запускался: 0</div>
    <div id="scrollRuns">Прокрутка обработана: 0</div>
    <div id="handlers">Обработчиков кнопок: 0</div>
    <div id="cart">В корзине: 0</div>
    <div id="nodes">Элементов на странице: 0</div>
    <div id="fromCache">Из кеша: 0 из 0</div>
    <div id="loaded">Скачано: 0 кБ</div>

  </div>
 
  <button class="up" id="up">Наверх</button>
 
  <main class="cards"></main>

  <button class="more" id="more">Показать ещё</button>

  <script src="script.js"></script>
</body>
</html>
